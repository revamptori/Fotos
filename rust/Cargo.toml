[package]
name = "fotos_engine"
version = "0.1.0"
edition = "2021"
description = "Lightweight Rust media engine for Fotos Android gallery"

[lib]
name = "fotos_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
lru = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
